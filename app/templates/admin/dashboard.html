{% extends "base.html" %}

{% block title %}Quản trị - Hệ thống quản lý sản phẩm{% endblock %}

{% block content %}
<h1 class="mb-4"><i class="bi bi-gear"></i> Bảng điều khiển</h1>

<div class="row g-4 mb-4">
    <div class="col-md-6">
        <div class="card bg-primary text-white shadow">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="text-uppercase">Sản phẩm</h6>
                        <h2 class="mb-0">{{ product_count }}</h2>
                    </div>
                    <div class="align-self-center">
                        <i class="bi bi-box-seam display-4 opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card bg-success text-white shadow">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="text-uppercase">Người dùng</h6>
                        <h2 class="mb-0">{{ user_count }}</h2>
                    </div>
                    <div class="align-self-center">
                        <i class="bi bi-people display-4 opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-box-seam"></i> Quản lý sản phẩm</h5>
            </div>
            <div class="card-body">
                <a href="{{ url_for('admin.add_product') }}" class="btn btn-success mb-3">
                    <i class="bi bi-plus-lg"></i> Thêm sản phẩm
                </a>
                <a href="{{ url_for('products.product_list') }}" class="btn btn-outline-primary mb-3">
                    <i class="bi bi-list"></i> Xem tất cả
                </a>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-people"></i> Quản lý người dùng</h5>
            </div>
            <div class="card-body">
                <a href="{{ url_for('admin.user_list') }}" class="btn btn-outline-primary">
                    <i class="bi bi-list"></i> Danh sách người dùng
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
