env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - http://web:5000
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 2
    url: http://web:5000
  type: spider
- parameters:
    maxDuration: 0
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules:
  - action: WARN
    customMessage: ''
    id: 10015
  - action: WARN
    customMessage: ''
    id: 10020
  - action: WARN
    customMessage: ''
    id: 10021
  - action: WARN
    customMessage: ''
    id: 10036
  - action: WARN
    customMessage: ''
    id: 10038
  - action: WARN
    customMessage: ''
    id: 10054
  - action: WARN
    customMessage: ''
    id: 10055
  - action: WARN
    customMessage: ''
    id: 10096
  - action: WARN
    customMessage: ''
    id: 10098
  - action: WARN
    customMessage: ''
    id: 10202
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: zap-report.html
    reportTitle: ZAP Scanning Report
    template: traditional-html
  type: report
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: zap-report.json
    reportTitle: ZAP Scanning Report
    template: traditional-json
  type: report
